name: DevSweep distribution backend

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: DevSweep commit or tag to build
        required: true
        default: f6edf6e
        type: string

permissions:
  contents: read

jobs:
  distribute:
    runs-on: macos-15
    steps:
      - name: Check out DevSweep source
        uses: actions/checkout@v4
        with:
          repository: misswell/DevSweep
          ref: ${{ inputs.source_ref }}
          path: devsweep

      - name: Import Developer ID signing certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Build, sign, notarize, staple, and package DevSweep
        working-directory: devsweep
        env:
          DEVSWEEP_ARCHS: arm64 x86_64
          DEVSWEEP_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          DEVSWEEP_APPLE_ID: ${{ secrets.APPLE_ID }}
          DEVSWEEP_APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          DEVSWEEP_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ./scripts/distribute_app.sh

      - name: Verify final distribution
        working-directory: devsweep
        run: |
          codesign --verify --deep --strict DevSweep.app
          codesign -dvvv DevSweep.app 2>&1 | grep -E 'Authority=Developer ID Application|Timestamp=|TeamIdentifier='
          xcrun stapler validate DevSweep.app
          spctl --assess --type execute --verbose DevSweep.app

      - name: Upload signed distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: DevSweep-0.1.5-developer-id
          path: devsweep/.build/release/DevSweep-*-macos.zip
          if-no-files-found: error
          retention-days: 3
