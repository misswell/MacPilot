name: Build macOS app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      signed_test:
        description: Build a Developer ID signed and notarized test artifact without publishing a release
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: read

jobs:
  build:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') && (github.event_name != 'workflow_dispatch' || !inputs.signed_test) }}
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show build environment
        run: |
          swift --version
          xcodebuild -version

      - name: Resolve app version
        id: version
        run: |
          version="$(./Scripts/version.sh)"
          build_number="$(git rev-list --count HEAD)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "MACPILOT_VERSION=$version" >> "$GITHUB_ENV"
          echo "MACPILOT_BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"
          echo "Building MacPilot $version ($build_number)"

      - name: Build release binary
        run: swift build -c release -Xswiftc -warnings-as-errors --arch arm64 --arch x86_64

      - name: Package app bundle
        env:
          MACPILOT_ALLOW_UNSTABLE_SIGNING: "1"
        run: ./Scripts/build-app.sh

      - name: Verify app signature
        run: codesign --verify --deep --strict MacPilot.app

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacPilot-${{ steps.version.outputs.version }}-macos
          path: MacPilot.app
          retention-days: 14

  signed-test:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.signed_test }}
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import Developer ID signing certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Resolve app version
        id: version
        run: |
          version="$(./Scripts/version.sh)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "MACPILOT_VERSION=$version" >> "$GITHUB_ENV"
          echo "MACPILOT_BUILD_NUMBER=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Sign, notarize, staple, and package
        env:
          MACPILOT_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          MACPILOT_APPLE_ID: ${{ secrets.APPLE_ID }}
          MACPILOT_APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          MACPILOT_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ./Scripts/distribute-app.sh

      - name: Upload signed test artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacPilot-${{ steps.version.outputs.version }}-developer-id-test
          path: MacPilot-${{ steps.version.outputs.version }}-macos.zip
          retention-days: 7

  release-gate:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Require successful main-branch validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..60}; do
            main_run="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow build.yml \
              --commit "$GITHUB_SHA" \
              --json databaseId,headBranch,status,conclusion \
              --limit 20 \
              --jq '[.[] | select(.headBranch == "main")] | first')"
            if [[ -z "$main_run" || "$main_run" == "null" ]]; then
              echo "Waiting for the main-branch run for $GITHUB_SHA ($attempt/30)"
              sleep 10
              continue
            fi

            status="$(jq -r '.status' <<<"$main_run")"
            conclusion="$(jq -r '.conclusion // empty' <<<"$main_run")"
            if [[ "$status" != "completed" ]]; then
              echo "Main-branch validation is still $status ($attempt/30)"
              sleep 10
              continue
            fi
            if [[ "$conclusion" == "success" ]]; then
              echo "Main-branch validation passed for $GITHUB_SHA"
              exit 0
            fi

            echo "Main-branch validation finished with conclusion: $conclusion"
            exit 1
          done

          echo "Timed out waiting for main-branch validation"
          exit 1

  dist:
    if: ${{ startsWith(github.ref, 'refs/tags/v') && needs.release-gate.result == 'success' }}
    needs: release-gate
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import Developer ID signing certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Resolve app version
        id: version
        run: |
          version="$(./Scripts/version.sh)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "MACPILOT_VERSION=$version" >> "$GITHUB_ENV"
          if [[ "${GITHUB_REF_NAME}" == "v1.1.20" ]]; then
            echo "bridge=1" >> "$GITHUB_OUTPUT"
            echo "archive_prefix=OctoPilot" >> "$GITHUB_OUTPUT"
          else
            echo "bridge=0" >> "$GITHUB_OUTPUT"
            echo "archive_prefix=MacPilot" >> "$GITHUB_OUTPUT"
          fi

      - name: Sign, notarize, staple, and package both architectures
        env:
          MACPILOT_BRIDGE: ${{ steps.version.outputs.bridge }}
          MACPILOT_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          MACPILOT_APPLE_ID: ${{ secrets.APPLE_ID }}
          MACPILOT_APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          MACPILOT_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for architecture in arm64 x86_64; do
            echo "==> Creating $architecture distributable"
            MACPILOT_ARCHS="$architecture" ./Scripts/distribute-app.sh
          done

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          --title "MacPilot ${{ github.ref_name }}"
          --generate-notes
          "${{ steps.version.outputs.archive_prefix }}-${{ steps.version.outputs.version }}-arm64-macos.zip#MacPilot for Apple Silicon"
          "${{ steps.version.outputs.archive_prefix }}-${{ steps.version.outputs.version }}-x86_64-macos.zip#MacPilot for Intel"
