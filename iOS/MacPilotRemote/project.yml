name: MacPilotRemote
options:
  bundleIdPrefix: com.misswell
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  MacPilotRemoteProtocol:
    path: ../../Packages/MacPilotRemoteProtocol

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  MacPilotRemote:
    type: application
    platform: iOS
    sources:
      - path: MacPilotRemote
    dependencies:
      - package: MacPilotRemoteProtocol
        product: MacPilotRemoteProtocol
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.misswell.macpilot.remote
        PRODUCT_NAME: MacPilot Remote
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: MacPilotRemote/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
