name: MacPilotRemote
options:
  bundleIdPrefix: com.misswell
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  MacPilotRemoteProtocol:
    path: ../../Packages/MacPilotRemoteProtocol

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Matches the Apple Development / Apple Distribution identities installed in
    # the login keychain, so device builds sign without extra flags.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: U8U443D7ZL

targets:
  MacPilotRemote:
    type: application
    platform: iOS
    sources:
      - path: MacPilotRemote
    dependencies:
      - package: MacPilotRemoteProtocol
        product: MacPilotRemoteProtocol
      - package: MacPilotRemoteProtocol
        product: MacPilotRemoteTransport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.misswell.macpilot.remote
        PRODUCT_NAME: MacPilot Remote
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "2"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: MacPilotRemote/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO

  MacPilotRemoteScreenshots:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ScreenshotTests
    dependencies:
      - target: MacPilotRemote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.misswell.macpilot.remote.screenshots
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MacPilotRemote
        SUPPORTS_MACCATALYST: NO

schemes:
  MacPilotRemote:
    build:
      targets:
        MacPilotRemote: all
    archive:
      config: Release
  MacPilotRemoteScreenshots:
    build:
      targets:
        MacPilotRemote: all
        MacPilotRemoteScreenshots: [test]
    test:
      config: Debug
      targets:
        - MacPilotRemoteScreenshots
